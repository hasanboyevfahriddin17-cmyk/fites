<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Fitness & Body Diagnostics</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            obsidian: { 950: '#030508', 900: '#070A12', 800: '#0C111D', 700: '#151C2C', 600: '#1E293B' },
            emerald: { 400: '#34D399', 500: '#10B981', 600: '#059669' },
            cyan: { 400: '#22D3EE', 500: '#06B6D4' },
            amber: { 400: '#FBBF24', 500: '#F59E0B' },
            rose: { 400: '#FB7185', 500: '#F43F5E' },
            violet: { 400: '#A78BFA', 500: '#8B5CF6', 600: '#7C3AED' },
            fuchsia: { 400: '#E879F9', 500: '#D946EF' },
            lime: { 400: '#A3E635', 500: '#84CC16' },
          },
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
        }
      }
    };
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 0%, #0D1527 0%, #060911 60%, #020306 100%);
      color: #E2E8F0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .bg-grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(16,185,129,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(139,92,246,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .bg-radial {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(ellipse 90% 65% at 50% -10%, rgba(139,92,246,0.12) 0%, rgba(6,182,212,0.08) 45%, transparent 75%),
                  radial-gradient(ellipse 70% 50% at 90% 90%, rgba(16,185,129,0.08) 0%, transparent 60%),
                  radial-gradient(ellipse 60% 40% at 10% 80%, rgba(217,70,239,0.06) 0%, transparent 60%);
    }
    .floating-orb {
      position: fixed; border-radius: 50%; filter: blur(95px); pointer-events: none; z-index: 0;
      animation: float 10s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px) scale(1) rotate(0deg); }
      50% { transform: translateY(-35px) scale(1.1) rotate(10deg); }
    }

    /* Exotic Aurora Glow Header Badge */
    .aurora-text {
      background: linear-gradient(135deg, #34D399 0%, #22D3EE 35%, #A78BFA 70%, #F472B6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 12px rgba(34,211,238,0.35));
    }

    /* Fitness background floating badges */
    .fitness-float-icon {
      position: fixed; pointer-events: none; z-index: 1; opacity: 0.16;
      animation: floatBadge 14s ease-in-out infinite alternate;
      color: #34D399;
      filter: drop-shadow(0 0 18px rgba(52,211,153,0.5));
      transition: opacity 0.3s;
    }
    .fitness-float-icon.cyan {
      color: #22D3EE;
      filter: drop-shadow(0 0 18px rgba(34,211,238,0.5));
    }
    .fitness-float-icon.purple {
      color: #A78BFA;
      filter: drop-shadow(0 0 18px rgba(167,139,250,0.5));
    }
    .fitness-float-icon.fuchsia {
      color: #F472B6;
      filter: drop-shadow(0 0 18px rgba(244,114,182,0.5));
    }
    .fitness-float-icon.amber {
      color: #FBBF24;
      filter: drop-shadow(0 0 18px rgba(251,191,36,0.5));
    }

    @keyframes floatBadge {
      0% { transform: translateY(0px) rotate(0deg) scale(1); }
      50% { transform: translateY(-30px) rotate(12deg) scale(1.1); }
      100% { transform: translateY(-50px) rotate(-8deg) scale(0.94); }
    }

    /* Animated heartbeat pulse line in background */
    .heartbeat-line {
      position: fixed; bottom: 35px; left: 0; width: 100%; height: 65px;
      pointer-events: none; z-index: 1; opacity: 0.22;
      filter: drop-shadow(0 0 8px #22D3EE);
    }

    #particles-canvas {
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(25px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    /* Holographic Cyber Glass */
    .glass {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.015) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 1.25rem;
      box-shadow: 0 10px 35px -5px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.3s;
    }
    .glass:hover {
      border-color: rgba(34, 211, 238, 0.25);
      box-shadow: 0 15px 40px -5px rgba(6, 182, 212, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .glass-strong {
      background: linear-gradient(145deg, rgba(17, 24, 43, 0.75) 0%, rgba(8, 12, 22, 0.85) 100%);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(34, 211, 238, 0.16);
      border-radius: 1.5rem;
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.6), 0 0 30px -10px rgba(16, 185, 129, 0.15), inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }

    .step-dot {
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 800;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative; cursor: default;
    }
    .step-dot.active {
      background: linear-gradient(135deg, #10B981, #06B6D4 50%, #8B5CF6 100%);
      box-shadow: 0 0 0 4px rgba(6,182,212,0.3), 0 0 25px rgba(6,182,212,0.7);
      transform: scale(1.15);
    }
    .step-dot.completed {
      background: linear-gradient(135deg, #059669, #0891B2);
      box-shadow: 0 0 12px rgba(5,150,105,0.4);
    }
    .step-dot.pending {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.35);
    }

    .custom-slider {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 7px; outline: none;
      border-radius: 999px; cursor: pointer;
      background: linear-gradient(90deg, rgba(16,185,129,0.3), rgba(6,182,212,0.3), rgba(139,92,246,0.3));
    }
    .custom-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 24px; height: 24px; border-radius: 50%;
      background: linear-gradient(135deg, #22D3EE, #10B981 50%, #A78BFA 100%);
      cursor: pointer;
      box-shadow: 0 0 0 4px rgba(34,211,238,0.3), 0 0 20px rgba(34,211,238,0.7);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .custom-slider::-webkit-slider-thumb:hover {
      transform: scale(1.25);
      box-shadow: 0 0 0 6px rgba(34,211,238,0.4), 0 0 30px rgba(34,211,238,0.9);
    }

    .card-option {
      border: 1.5px solid rgba(255,255,255,0.08);
      border-radius: 1.25rem; cursor: pointer;
      transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      background: linear-gradient(145deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
      position: relative; overflow: hidden;
    }
    .card-option:hover {
      border-color: rgba(34,211,238,0.5);
      background: linear-gradient(145deg, rgba(34,211,238,0.08) 0%, rgba(139,92,246,0.05) 100%);
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 10px 25px -5px rgba(6,182,212,0.25);
    }
    .card-option.selected {
      border-color: #22D3EE;
      background: linear-gradient(145deg, rgba(6,182,212,0.18) 0%, rgba(139,92,246,0.12) 100%);
      box-shadow: 0 0 0 1px rgba(34,211,238,0.5), 0 12px 35px rgba(6,182,212,0.35);
    }
    .card-option .check-icon {
      display: none; position: absolute; top: 12px; right: 12px;
      width: 24px; height: 24px; border-radius: 50%;
      background: linear-gradient(135deg, #10B981, #06B6D4 50%, #8B5CF6 100%);
      align-items: center; justify-content: center; font-size: 0.7rem; color: white;
      box-shadow: 0 0 12px rgba(6,182,212,0.6);
    }
    .card-option.selected .check-icon { display: flex; }

    .neo-input {
      background: rgba(13, 21, 39, 0.7);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 0.875rem; color: #E2E8F0;
      font-weight: 700; outline: none;
      transition: all 0.25s;
    }
    .neo-input:focus {
      border-color: #22D3EE;
      box-shadow: 0 0 0 3px rgba(34,211,238,0.25), 0 0 15px rgba(34,211,238,0.3);
      background: rgba(13, 21, 39, 0.9);
    }

    .btn-primary {
      background: linear-gradient(135deg, #10B981 0%, #06B6D4 50%, #8B5CF6 100%);
      border: none; border-radius: 1rem;
      font-weight: 800; cursor: pointer;
      box-shadow: 0 6px 25px rgba(6,182,212,0.45);
      transition: all 0.25s;
      letter-spacing: 0.02em;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(6,182,212,0.65), 0 0 20px rgba(139,92,246,0.4);
      filter: brightness(1.08);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 1rem; font-weight: 700;
      cursor: pointer; transition: all 0.25s; color: rgba(255,255,255,0.75);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.09);
      border-color: rgba(34,211,238,0.3);
      color: #22D3EE;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .btn-danger {
      background: linear-gradient(135deg, rgba(244,63,94,0.15) 0%, rgba(217,70,239,0.15) 100%);
      border: 1px solid rgba(244,63,94,0.35);
      border-radius: 1rem; font-weight: 700;
      cursor: pointer; transition: all 0.25s; color: #FB7185;
    }
    .btn-danger:hover {
      background: linear-gradient(135deg, rgba(244,63,94,0.25) 0%, rgba(217,70,239,0.25) 100%);
      box-shadow: 0 0 20px rgba(244,63,94,0.35);
      color: #fff;
    }

    .gauge-container {
      position: relative; width: 220px; height: 115px; margin: 0 auto;
    }
    .gauge-bg {
      width: 220px; height: 110px;
      border-radius: 110px 110px 0 0;
      background: conic-gradient(from 180deg at 50% 100%, #3B82F6 0deg, #06B6D4 35deg, #10B981 70deg, #FBBF24 105deg, #F43F5E 140deg, transparent 140deg);
      position: relative;
    }
    .gauge-needle {
      position: absolute; bottom: 0; left: 50%;
      width: 3.5px; height: 88px;
      background: linear-gradient(to top, #FFFFFF, rgba(255,255,255,0));
      transform-origin: bottom center;
      border-radius: 2px;
      transition: transform 1.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 0 8px rgba(255,255,255,0.8);
    }
    .gauge-center {
      position: absolute; bottom: -7px; left: 50%;
      width: 18px; height: 18px; border-radius: 50%;
      background: linear-gradient(135deg, #22D3EE, #8B5CF6);
      transform: translateX(-50%);
      box-shadow: 0 0 20px rgba(34,211,238,0.8);
    }
    .gauge-center {
      position: absolute; bottom: -6px; left: 50%;
      width: 16px; height: 16px; border-radius: 50%;
      background: linear-gradient(135deg, #10B981, #06B6D4);
      transform: translateX(-50%);
      box-shadow: 0 0 15px rgba(16,185,129,0.6);
    }

    .water-glass {
      width: 32px; height: 42px;
      border: 2px solid rgba(6,182,212,0.3);
      border-top: none; border-radius: 0 0 6px 6px;
      position: relative; overflow: hidden;
      transition: all 0.3s;
    }
    .water-glass.filled { border-color: #06B6D4; }
    .water-glass.filled .water-fill {
      background: linear-gradient(to top, #0891B2, #22D3EE);
      box-shadow: 0 0 10px rgba(6,182,212,0.5);
    }
    .water-fill {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 0%; transition: height 0.3s ease;
    }

    .progress-bar-inner {
      height: 100%; border-radius: 999px;
      background: linear-gradient(90deg, #10B981, #06B6D4, #10B981);
      background-size: 200% 100%;
      animation: shimmer 2s linear infinite;
    }

    .step-content { animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
    .dashboard-section { animation: fadeUp 0.4s ease-out forwards; }

    .alert-warning {
      background: rgba(245,158,11,0.08);
      border: 1px solid rgba(245,158,11,0.3);
      border-radius: 0.875rem;
    }
    .alert-danger {
      background: rgba(244,63,94,0.08);
      border: 1px solid rgba(244,63,94,0.3);
      border-radius: 0.875rem;
    }
    .alert-success {
      background: rgba(16,185,129,0.08);
      border: 1px solid rgba(16,185,129,0.3);
      border-radius: 0.875rem;
    }
    .alert-info {
      background: rgba(6,182,212,0.08);
      border: 1px solid rgba(6,182,212,0.3);
      border-radius: 0.875rem;
    }

    .badge {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.25rem 0.75rem; border-radius: 999px;
      font-size: 0.75rem; font-weight: 700;
    }

    .validation-msg { font-size: 0.8rem; font-weight: 500; margin-top: 0.5rem; }
    .validation-msg.error { color: #FB7185; }
    .validation-msg.success { color: #34D399; }
    .validation-msg.warning { color: #FBBF24; }

    .macro-pill {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.75rem 1rem; border-radius: 0.75rem;
      font-size: 0.9rem; font-weight: 600;
    }

    @media print {
      body { background: #ffffff !important; color: #111827 !important; }
      .bg-grid, .bg-radial, .floating-orb, #stepper-section, .no-print { display: none !important; }
      #dashboard-section { display: block !important; padding: 0 !important; }
      .glass, .glass-strong { background: #f9fafb !important; border: 1px solid #e5e7eb !important; backdrop-filter: none !important; color: #111827 !important; }
      .text-white { color: #111827 !important; }
      .text-slate-400, .text-slate-500 { color: #4b5563 !important; }
      .alert-warning { background: #fffbeb !important; border-color: #fcd34d !important; color: #92400e !important; }
      .alert-danger { background: #fff1f2 !important; border-color: #fda4af !important; color: #9f1239 !important; }
      .alert-success { background: #f0fdf4 !important; border-color: #86efac !important; color: #166534 !important; }
      .alert-info { background: #ecfeff !important; border-color: #67e8f9 !important; color: #155e75 !important; }
      #print-header { display: block !important; }
    }
    #print-header { display: none; }
  </style>
</head>

<body>
  <div class="bg-grid"></div>
  <div class="bg-radial"></div>
  <canvas id="particles-canvas"></canvas>

  <div class="floating-orb" style="width:450px;height:450px;background:rgba(16,185,129,0.06);top:-100px;right:-100px;"></div>
  <div class="floating-orb" style="width:380px;height:380px;background:rgba(6,182,212,0.06);bottom:100px;left:-100px;animation-delay:-4s;"></div>
  <div class="floating-orb" style="width:300px;height:300px;background:rgba(245,158,11,0.04);top:45%;left:45%;animation-delay:-2s;"></div>

  <!-- Fitness Themed Floating Animated Background Icons -->
  <div class="fitness-float-icon text-5xl" style="top:12%; left:6%; animation-duration: 14s;"><i class="fa-solid fa-dumbbell"></i></div>
  <div class="fitness-float-icon cyan text-4xl" style="top:25%; right:8%; animation-duration: 16s; animation-delay: -3s;"><i class="fa-solid fa-heart-pulse"></i></div>
  <div class="fitness-float-icon amber text-5xl" style="top:65%; left:5%; animation-duration: 18s; animation-delay: -6s;"><i class="fa-solid fa-fire"></i></div>
  <div class="fitness-float-icon cyan text-4xl" style="top:75%; right:7%; animation-duration: 13s; animation-delay: -2s;"><i class="fa-solid fa-bottle-water"></i></div>
  <div class="fitness-float-icon rose text-3xl" style="top:42%; right:14%; animation-duration: 15s; animation-delay: -5s;"><i class="fa-solid fa-apple-whole"></i></div>
  <div class="fitness-float-icon text-4xl" style="top:50%; left:12%; animation-duration: 17s; animation-delay: -4s;"><i class="fa-solid fa-stopwatch-20"></i></div>
  <div class="fitness-float-icon text-3xl" style="top:85%; left:22%; animation-duration: 19s; animation-delay: -8s;"><i class="fa-solid fa-person-running"></i></div>
  <div class="fitness-float-icon cyan text-3xl" style="top:15%; right:25%; animation-duration: 12s; animation-delay: -7s;"><i class="fa-solid fa-shoe-prints"></i></div>

  <!-- Subtle EKG Heartbeat SVG Line at Bottom -->
  <div class="heartbeat-line">
    <svg viewBox="0 0 1200 60" preserveAspectRatio="none" style="width:100%;height:100%;">
      <path d="M0,30 L300,30 L320,30 L330,10 L340,50 L350,15 L360,38 L370,30 L700,30 L720,30 L730,10 L740,50 L750,15 L760,38 L770,30 L1200,30" 
            fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="1200" stroke-dashoffset="1200"
            style="animation: drawEkg 6s linear infinite; opacity: 0.4;">
      </path>
    </svg>
    <style>
      @keyframes drawEkg {
        0% { stroke-dashoffset: 1200; }
        50% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -1200; }
      }
    </style>
  </div>

  <div class="relative z-10 min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 py-4 px-6" style="background:rgba(7,10,18,0.88);backdrop-filter:blur(24px);border-bottom:1px solid rgba(34,211,238,0.12);box-shadow:0 10px 30px -10px rgba(0,0,0,0.7);">
      <div class="max-w-6xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-2xl flex items-center justify-center relative" style="background:linear-gradient(135deg,rgba(34,211,238,0.2),rgba(139,92,246,0.25));border:1.5px solid rgba(34,211,238,0.4);box-shadow:0 0 20px rgba(34,211,238,0.35);">
            <i class="fa-solid fa-dna text-xl text-cyan-300"></i>
          </div>
          <div>
            <h1 class="font-black text-xl leading-tight aurora-text tracking-tight">Smart Fitness</h1>
            <p class="text-xs text-cyan-400/70 font-semibold tracking-wider uppercase">Biometrik Tashxis Tizimi</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div id="header-step-label" class="badge text-cyan-300" style="background:linear-gradient(135deg,rgba(34,211,238,0.15),rgba(139,92,246,0.15));border:1px solid rgba(34,211,238,0.35);box-shadow:0 0 15px rgba(6,182,212,0.2);">
            <i class="fa-solid fa-circle-dot text-xs text-cyan-400"></i>
            <span>Boshlash</span>
          </div>
          <button id="print-btn" class="btn-secondary hidden px-4 py-2 text-sm items-center gap-2 no-print" onclick="window.print()">
            <i class="fa-solid fa-print text-xs"></i> Print / PDF
          </button>
          <button id="reset-btn" class="btn-danger hidden px-4 py-2 text-sm items-center gap-2 no-print" onclick="resetApp()">
            <i class="fa-solid fa-rotate-left text-xs"></i> Qayta hisoblash
          </button>
        </div>
      </div>
    </header>

    <!-- PRINT HEADER -->
    <div id="print-header" style="padding:20px 0 10px;border-bottom:2px solid #e5e7eb;margin-bottom:20px;">
      <h1 style="font-size:22pt;font-weight:900;color:#111827;">🧬 Smart Fitness & Body Diagnostics</h1>
      <p style="color:#6b7280;margin-top:4px;">Shaxsiy fitnes va biometric tahlil hisoboti</p>
      <p id="print-date" style="color:#9ca3af;font-size:10pt;margin-top:2px;"></p>
    </div>

    <!-- STEPPER SECTION -->
    <section id="stepper-section" class="flex-1 py-8 px-4 flex flex-col justify-center">
      <div class="max-w-3xl mx-auto w-full">

        <!-- Wizard Progress -->
        <div class="mb-8 glass-strong p-5">
          <div class="flex items-center justify-between mb-4 overflow-x-auto gap-1" id="step-indicators"></div>
          <div class="h-2 rounded-full" style="background:rgba(255,255,255,0.05);">
            <div id="progress-bar" class="progress-bar-inner rounded-full" style="width:11.11%;transition:width 0.4s ease;"></div>
          </div>
          <div class="flex justify-between mt-3 text-xs">
            <span id="step-counter" class="text-slate-500 font-medium">Qadam 1 / 9</span>

  <script>
  const state = {
    step: 1,
    totalSteps: 9,
    answers: {
      gender: null,
      age: 25,
      height: 175,
      weight: 75,
      goal: null,
      activity: null,
      targetWeight: 70,
      durationWeeks: 10,
      waterIntake: 2.0,
      sleepHours: 7.5,
    },
    metrics: {},
    warnings: [],
    charts: {},
    tracker: {
      photoBefore: null,
      photoCurrent: null,
      waterDrunkLiters: 0,
    }
  };

  function saveState() {
    const data = { answers: state.answers, tracker: state.tracker };
    localStorage.setItem('smartFitnessState', JSON.stringify(data));
  }

  function loadState() {
    const saved = localStorage.getItem('smartFitnessState');
    if (saved) {
      try {
        const data = JSON.parse(saved);
        if (data.answers) state.answers = { ...state.answers, ...data.answers };
        if (data.tracker) state.tracker = { ...state.tracker, ...data.tracker };
        if (state.answers.gender && state.answers.goal && state.answers.activity) {
          state.step = 10; // Jump to dashboard if already completed
        }
      } catch (e) {}
    }
  }

  const STEP_NAMES = [
    'Jinsingizni Tanlang',
    'Yoshingiz va Bo\'yingiz',
    'Hozirgi Tana Vazningiz',
    'Asosiy Fitnes Maqsadingiz',
    'Jismoniy Faollik Maromingiz',
    'Ko\'zlangan Maqsadli Vazn',
    'Erishish Muddati (Haftalar)',
    'Kunlik Toza Suv Iste\'moli',
    'Tungi Uyqu va Tiklanish',
  ];

  const ACTIVITY_OPTIONS = [
    { val: 1.2, label: 'Kamharakat turmush tarzi (Sedentary)', icon: 'fa-couch', desc: 'Asosan o\'tirib ishlash, muntazam mashg\'ulotlar deyarli yo\'q', color: '#94A3B8' },
    { val: 1.375, label: 'Yengil jismoniy faollik (Light)', icon: 'fa-person-walking', desc: 'Haftasiga 1–3 marotaba yengil yurish, gimnastika yoki mashqlar', color: '#34D399' },
    { val: 1.55, label: 'O\'rtacha sport faolligi (Moderate)', icon: 'fa-dumbbell', desc: 'Haftasiga 3–5 marotaba o\'rtacha zo\'riqishdagi fitnes mashg\'ulotlari', color: '#10B981' },
    { val: 1.725, label: 'Yuqori intensiv faollik (Heavy)', icon: 'fa-fire', desc: 'Haftasiga 6–7 kun to\'liq og\'ir atletika yoki intensiv krossfit', color: '#F59E0B' },
    { val: 1.9, label: 'Professional sportchi (Athlete)', icon: 'fa-trophy', desc: 'Kuniga 2 martadan professional mashg\'ulotlar yoki og\'ir jismoniy mehnat', color: '#EF4444' },
  ];

  const GOAL_OPTIONS = [
    { val: 'loss', label: 'Ozish va Yog\' Yoqish (Fat Loss)', icon: 'fa-fire-flame-curved', desc: 'Ortiqcha yog\' qatlamlaridan xalos bo\'lish, relyef va yengillikka erishish', color: '#F59E0B', gradient: 'rgba(245,158,11,0.1)' },
    { val: 'maintain', label: 'Vaznni Saqlash (Maintenance)', icon: 'fa-scale-balanced', desc: 'Mavjud tana tuzilishini asrash, salomatlik va biologik tonusni ushlab turish', color: '#06B6D4', gradient: 'rgba(6,182,212,0.1)' },
    { val: 'gain', label: 'Quruq Mushak Massasi (Muscle Gain)', icon: 'fa-person-arrow-up-from-line', desc: 'Mushak tolalarini o\'stirish, jismoniy kuch va tananing quvvat salohiyatini oshirish', color: '#10B981', gradient: 'rgba(16,185,129,0.1)' },
  ];

  function calculateDiagnostics() {
    const a = state.answers;

    // 1. BMR (Mifflin-St Jeor)
    let bmr = 0;
    if (a.gender === 'male') {
      bmr = 10 * a.weight + 6.25 * a.height - 5 * a.age + 5;
    } else {
      bmr = 10 * a.weight + 6.25 * a.height - 5 * a.age - 161;
    }

    // 2. TDEE
    const tdee = bmr * a.activity;

    // 3. BMI
    const hM = a.height / 100;
    const bmi = a.weight / (hM * hM);
    let bmiCategory = '', bmiColor = '';
    if (bmi < 18.5) { bmiCategory = 'Vazn yetishmovchiligi (Kam vazn)'; bmiColor = '#3B82F6'; }
    else if (bmi < 25) { bmiCategory = 'Me\'yordagi ideal vazn'; bmiColor = '#10B981'; }
    else if (bmi < 30) { bmiCategory = 'Ortiqcha vazn bosqichi'; bmiColor = '#F59E0B'; }
    else { bmiCategory = 'Semizlik holati (Diqqat talab)'; bmiColor = '#EF4444'; }

    const targetBMI = a.targetWeight / (hM * hM);

    // 4. Caloric Target
    let caloricTarget = 0;
    let deficitSurplus = 0;
    if (a.goal === 'loss') {
      caloricTarget = Math.round(tdee * 0.80); // 20% deficit
      deficitSurplus = caloricTarget - tdee;
    } else if (a.goal === 'maintain') {
      caloricTarget = Math.round(tdee);
      deficitSurplus = 0;
    } else {
      caloricTarget = Math.round(tdee * 1.12); // 12% surplus
      deficitSurplus = caloricTarget - tdee;
    }

    // 5. Macros
    let proteinG = 0, fatG = 0, carbG = 0;
    if (a.goal === 'loss') {
      proteinG = Math.round(a.weight * 2.1);
      fatG = Math.round(a.weight * 0.9);
    } else if (a.goal === 'gain') {
      proteinG = Math.round(a.weight * 2.0);
      fatG = Math.round(a.weight * 1.0);
    } else {
      proteinG = Math.round(a.weight * 1.7);
      fatG = Math.round(a.weight * 0.9);
    }
    const proteinKcal = proteinG * 4;
    const fatKcal = fatG * 9;
    const remainingKcal = Math.max(caloricTarget - proteinKcal - fatKcal, 0);
    carbG = Math.round(remainingKcal / 4);
    const carbKcal = carbG * 4;

    // 6. Water Calculation
    const waterReqML = a.weight * 38 + (a.activity - 1.2) * 600;
    const waterReqL = (waterReqML / 1000).toFixed(1);

    // 7. Trajectory
    const totalDiff = a.targetWeight - a.weight;
    const weeklyRate = totalDiff / a.durationWeeks;
    const trajectory = [];
    for (let w = 0; w <= a.durationWeeks; w++) {
      trajectory.push(+(a.weight + weeklyRate * w).toFixed(1));
    }

    // 8. Warnings & Penalties
    const warnings = [];
    if (a.sleepHours < 7) {
      warnings.push({
        type: 'danger',
        icon: 'fa-moon',
        title: 'Metabolik susayish: Surunkali uyqu tanqisligi (-15%)',
        msg: `Siz kuniga atigi ${a.sleepHours} soat uxlayapsiz. Me'yordan kam uyqu stress gormoni (kortizol) miqdorini oshiradi va tana yog'ini parchalash samaradorligini o'rtacha 15% ga pasaytiradi.`
      });
    }
    if (a.waterIntake < parseFloat(waterReqL) * 0.8) {
      warnings.push({
        type: 'warning',
        icon: 'fa-droplet',
        title: 'Energetik pasayish: Suv muvozanati yetarli emas (-10%)',
        msg: `Kunlik ${a.waterIntake} litr suv ichmoqdasiz, organizmingizga esa ${waterReqL} litr talab etiladi. Suvsizlanish hujayralarning quvvat ishlab chiqarishini 10% ga tushirib, charchoqni keltirib chiqaradi.`
      });
    }
    if (Math.abs(weeklyRate) > 1.0 && a.goal === 'loss') {
      warnings.push({
        type: 'danger',
        icon: 'fa-triangle-exclamation',
        title: 'Sog\'liq uchun xatarli vazn yo\'qotish tezligi!',
        msg: `Haftasiga ${Math.abs(weeklyRate).toFixed(2)} kg yo'qotish organizm uchun o'ta xavflidir. Bu yog' o'rniga mushaklarning erishiga va moddalar almashinuvining jiddiy sekinlashishiga sabab bo'ladi. Xavfsiz ko'rsatkich: haftasiga 0.5–1.0 kg.`
      });
    }

    // Scores
    const sleepScore = Math.min(Math.round((a.sleepHours / 8) * 100), 100);
    const hydraScore = Math.min(Math.round((a.waterIntake / parseFloat(waterReqL)) * 100), 100);
    const actScore = Math.round(((a.activity - 1.2) / 0.7) * 100);
    const calScore = 95;

    state.metrics = {
      bmr: Math.round(bmr),
      tdee: Math.round(tdee),
      bmi: +bmi.toFixed(1),
      bmiCategory,
      bmiColor,
      targetBMI: +targetBMI.toFixed(1),
      caloricTarget,
      deficitSurplus: Math.round(deficitSurplus),
      proteinG, fatG, carbG,
      proteinKcal, fatKcal, carbKcal,
      waterReqL,
      weeklyRate: +weeklyRate.toFixed(2),
      trajectory,
      sleepScore, hydraScore, actScore, calScore,
      totalScore: Math.round((sleepScore + hydraScore + actScore + calScore) / 4)
    };
    state.warnings = warnings;
  }

  function renderStepIndicators() {
    const container = document.getElementById('step-indicators');
    container.innerHTML = STEP_NAMES.map((name, i) => {
      const n = i + 1;
      let cls = n < state.step ? 'completed' : n === state.step ? 'active' : 'pending';
      const icon = n < state.step ? '<i class="fa-solid fa-check text-xs text-white"></i>' : `<span>${n}</span>`;
      return `
        <div class="flex flex-col items-center gap-1 min-w-[36px]">
          <div class="step-dot ${cls}">${icon}</div>
        </div>
      `;
    }).join('<div class="flex-1 h-px bg-white/10 mx-1"></div>');
  }

  function updateStepperProgress() {
    const pct = ((state.step - 1) / (state.totalSteps - 1)) * 100;
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('step-counter').textContent = `Qadam ${state.step} / ${state.totalSteps}`;
    document.getElementById('step-name-label').textContent = STEP_NAMES[state.step - 1];
    document.getElementById('header-step-label').innerHTML = `<i class="fa-solid fa-circle-dot text-xs"></i><span>${STEP_NAMES[state.step-1]}</span>`;

    const prev = document.getElementById('btn-prev');
    const next = document.getElementById('btn-next');
    prev.style.visibility = state.step === 1 ? 'hidden' : 'visible';
    if (state.step === state.totalSteps) {
      next.innerHTML = '<i class="fa-solid fa-chart-line text-xs"></i> Diagnostikani Ko\'rish';
    } else {
      next.innerHTML = 'Davom etish <i class="fa-solid fa-arrow-right text-xs"></i>';
    }
    renderStepIndicators();
  }

  function renderCurrentStep() {
    const area = document.getElementById('step-area');
    area.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'step-content glass-strong p-6 sm:p-8';
    wrap.innerHTML = getStepMarkup(state.step);
    area.appendChild(wrap);
    bindEventsForStep(state.step);
    updateStepperProgress();
  }

      case 2:
        return `

  function bindEventsForStep(s) {
    if (s === 1) {
      document.querySelectorAll('[data-gender]').forEach(c => {
        c.addEventListener('click', () => {
          document.querySelectorAll('[data-gender]').forEach(x => x.classList.remove('selected'));
          c.classList.add('selected');
          state.answers.gender = c.dataset.gender;
          document.getElementById('v-msg').textContent = '';
        });
      });
    } else if (s === 2) {
      const ageS = document.getElementById('age-slider');
      const hS = document.getElementById('h-slider');
      ageS.addEventListener('input', () => {
        state.answers.age = +ageS.value;
        document.getElementById('age-val').textContent = state.answers.age;
      });
      hS.addEventListener('input', () => {
        state.answers.height = +hS.value;
        document.getElementById('h-val').textContent = state.answers.height;
      });
    } else if (s === 3) {
      const wS = document.getElementById('w-slider');
      const wI = document.getElementById('w-input');
      wS.addEventListener('input', () => {
        state.answers.weight = +wS.value;
        wI.value = state.answers.weight;
        document.getElementById('w-val').textContent = state.answers.weight;
      });
      wI.addEventListener('input', () => {
        const val = Math.min(Math.max(+wI.value || 35, 35), 190);
        state.answers.weight = val;
        wS.value = val;
        document.getElementById('w-val').textContent = val;
      });
    } else if (s === 4) {
      document.querySelectorAll('[data-goal]').forEach(c => {
        c.addEventListener('click', () => {
          document.querySelectorAll('[data-goal]').forEach(x => x.classList.remove('selected'));
          c.classList.add('selected');
          state.answers.goal = c.dataset.goal;
          document.getElementById('v-msg').textContent = '';
        });
      });
    } else if (s === 5) {
      document.querySelectorAll('[data-activity]').forEach(c => {
        c.addEventListener('click', () => {
          document.querySelectorAll('[data-activity]').forEach(x => x.classList.remove('selected'));
          c.classList.add('selected');
          state.answers.activity = +c.dataset.activity;
          document.getElementById('v-msg').textContent = '';
        });
      });
    } else if (s === 6) {
      const twS = document.getElementById('tw-slider');
      const updateTwNotice = () => {
        const diff = state.answers.targetWeight - state.answers.weight;
        document.getElementById('tw-val').textContent = state.answers.targetWeight;
        document.getElementById('tw-diff-info').textContent = `Farq: ${diff > 0 ? '+' : ''}${diff.toFixed(1)} kg`;
        const alertBox = document.getElementById('tw-alert');
        const hM = state.answers.height / 100;
        const targetBmi = state.answers.targetWeight / (hM * hM);
        if (targetBmi < 16 || targetBmi > 38) {
          alertBox.className = 'p-3 rounded-xl text-xs alert-danger';
          alertBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1.5"></i> Maqsadli BMI: ${targetBmi.toFixed(1)} (Juda xavfli ko'rsatkich!)`;
        } else {
          alertBox.className = 'p-3 rounded-xl text-xs alert-success';
          alertBox.innerHTML = `<i class="fa-solid fa-circle-check mr-1.5"></i> Maqsadli BMI: ${targetBmi.toFixed(1)} (Sog'lom va realistik diapazon)`;
        }
      };
      twS.addEventListener('input', () => {
        state.answers.targetWeight = +twS.value;
        updateTwNotice();
      });
      updateTwNotice();
    } else if (s === 7) {
      const durS = document.getElementById('dur-slider');
      const updateDurNotice = () => {
        const w = state.answers.durationWeeks;
        document.getElementById('dur-val').textContent = w;
        const diff = state.answers.targetWeight - state.answers.weight;
        const rate = Math.abs(diff / w);
        const alertBox = document.getElementById('dur-alert');
        if (rate > 1.0) {
          alertBox.className = 'p-3 rounded-xl text-xs alert-danger';
          alertBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1.5"></i> Haftalik tezlik: ${rate.toFixed(2)} kg/hafta (Juda tez va xavfli! Muddatni uzaytiring)`;
        } else {
          alertBox.className = 'p-3 rounded-xl text-xs alert-success';
          alertBox.innerHTML = `<i class="fa-solid fa-circle-check mr-1.5"></i> Haftalik sur'at: ${rate.toFixed(2)} kg/hafta (Xavfsiz va barqaror marom)`;
        }
      };
      durS.addEventListener('input', () => {
        state.answers.durationWeeks = +durS.value;
        updateDurNotice();
      });
      updateDurNotice();
    } else if (s === 8) {
      const wS = document.getElementById('water-slider');
      const renderGlasses = (val) => {
        const glassesCount = Math.min(Math.round(val / 0.25), 16);
        const container = document.getElementById('water-glasses');
        container.innerHTML = Array.from({ length: 12 }, (_, i) => {
          const filled = i < glassesCount;
          return `
            <div class="water-glass ${filled ? 'filled' : ''}" data-gidx="${i + 1}">
              <div class="water-fill" style="height:${filled ? '100%' : '0%'}"></div>
            </div>
          `;
        }).join('');
      };
      wS.addEventListener('input', () => {
        state.answers.waterIntake = +parseFloat(wS.value).toFixed(1);
        document.getElementById('water-val').textContent = state.answers.waterIntake;
        renderGlasses(state.answers.waterIntake);
      });
      renderGlasses(state.answers.waterIntake);
    } else if (s === 9) {
      const slS = document.getElementById('sleep-slider');
      const updateSleepStatus = (val) => {
        const el = document.getElementById('sleep-status');
        if (val < 7) {
          el.className = 'text-xs text-rose-400 font-semibold';
          el.textContent = '⚠ Uyqu yetarli emas: -15% metabolizm sekinlashishi';
        } else if (val <= 9) {
          el.className = 'text-xs text-emerald-400 font-semibold';
          el.textContent = '✓ Ideal biologik me\'yor: Maksimal mushak va asab tiklanishi';
        } else {
          el.className = 'text-xs text-cyan-400 font-semibold';
          el.textContent = 'Uzoq uyqu davomiyligi';
        }
      };
      slS.addEventListener('input', () => {
        state.answers.sleepHours = +parseFloat(slS.value).toFixed(1);
        document.getElementById('sleep-val').textContent = state.answers.sleepHours;
        updateSleepStatus(state.answers.sleepHours);
      });
      updateSleepStatus(state.answers.sleepHours);
    }
  }

  function validateCurrentStep() {
    const s = state.step;
    const msgEl = document.getElementById('v-msg');
    if (s === 1 && !state.answers.gender) {
      if (msgEl) { msgEl.className = 'validation-msg error'; msgEl.textContent = 'Iltimos, jinsingizni tanlang!'; }
      return false;
    }
    if (s === 4 && !state.answers.goal) {
      if (msgEl) { msgEl.className = 'validation-msg error'; msgEl.textContent = 'Iltimos, maqsadingizni tanlang!'; }
      return false;
    }
    if (s === 5 && !state.answers.activity) {
      if (msgEl) { msgEl.className = 'validation-msg error'; msgEl.textContent = 'Iltimos, faollik darajangizni tanlang!'; }
      return false;
    }
    return true;
  }

  function nextStep() {
    if (!validateCurrentStep()) return;
    if (state.step < state.totalSteps) {
      state.step++;
      renderCurrentStep();
    } else {
      showDashboard();
    }
  }

  function prevStep() {
    if (state.step > 1) {
      state.step--;
      renderCurrentStep();
    }
  }

  function showDashboard() {
    calculateDiagnostics();
    saveState();
    document.getElementById('stepper-section').classList.add('hidden');
    const dashSec = document.getElementById('dashboard-section');
    dashSec.classList.remove('hidden');
    document.getElementById('print-btn').style.display = 'flex';
    document.getElementById('reset-btn').style.display = 'flex';
    document.getElementById('header-step-label').innerHTML = `<i class="fa-solid fa-chart-pie text-xs"></i><span>Diagnostika Natijasi</span>`;
    document.getElementById('print-date').textContent = `Hisobot vaqti: ${new Date().toLocaleDateString('uz-UZ', { year:'numeric', month:'long', day:'numeric' })}`;

    dashSec.querySelector('#dashboard-content').innerHTML = generateDashboardMarkup();
    setTimeout(() => {
      initCharts();
    }, 50);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Interactive Cyber-Fitness Particle Background Animation
  function initParticles() {
    const canvas = document.getElementById('particles-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const particles = [];
    const particleCount = 35;
    const colors = ['rgba(16,185,129,0.3)', 'rgba(6,182,212,0.3)', 'rgba(245,158,11,0.2)'];

    for (let i = 0; i < particleCount; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.6,
        vy: (Math.random() - 0.5) * 0.6,
        radius: Math.random() * 2 + 1,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      // Draw and connect particles
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height;
        if (p.y > height) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();

        for (let j = i + 1; j < particles.length; j++) {
          const p2 = particles[j];
          const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
          if (dist < 110) {
            ctx.beginPath();
            ctx.strokeStyle = `rgba(16,185,129,${0.12 * (1 - dist / 110)})`;
            ctx.lineWidth = 0.8;
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animate);
    }
    animate();
  }

  // Interactivity Handlers
  window.onPhotoUpload = function(event, type) {
    const file = event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      state.tracker[type === 'before' ? 'photoBefore' : 'photoCurrent'] = e.target.result;
      saveState();
      showDashboard();
    };
    reader.readAsDataURL(file);
  };
  
  window.clearPhoto = function(type) {
    state.tracker[type === 'before' ? 'photoBefore' : 'photoCurrent'] = null;
    saveState();
    showDashboard();
  };
  
  window.addWater = function(amount) {
    state.tracker.waterDrunkLiters = Math.max(0, state.tracker.waterDrunkLiters + amount);
    saveState();
    document.getElementById('water-drunk-text').innerText = state.tracker.waterDrunkLiters.toFixed(2) + ' L';
    const percent = Math.min(100, (state.tracker.waterDrunkLiters / state.metrics.waterReqL) * 100);
    document.getElementById('water-progress-bar').style.width = percent + '%';
  };

  // START
  loadState();
  initParticles();
  if (state.step === 10) {
    showDashboard();
  } else {
    renderCurrentStep();
  }
