<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>
        body {
            margin: 0;
            padding: 32px;
            font-family: system-ui, -apple-system, sans-serif;
            background: #09090b;
            color: #f4f4f5;
        }
        .wrapper {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        h1 {
            margin: 0;
            font-size: 24px;
        }
        a {
            color: #60a5fa;
            text-decoration: none;
            font-size: 14px;
        }
        .table-card {
            background: #141419;
            border: 1px solid #23232c;
            border-radius: 12px;
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid #23232c;
        }
        th {
            background: #1b1b22;
            color: #a1a1aa;
            font-size: 13px;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .empty {
            text-align: center;
            color: #71717a;
            padding: 24px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="header">
            <h1>Azolar Royxati</h1>
            <a href="/index.html">Bosh sahifaga qaytish</a>
        </div>
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>T/r</th>
                        <th>Ism</th>
                        <th>Telefon</th>
                        <th>Tarif</th>
                        <th>Sana</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const tbody = document.getElementById("tableBody");
        const members = JSON.parse(localStorage.getItem("members") || "[]");

        if (members.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty">Hozircha hech kim royxatdan otmagan</td></tr>';
        } else {
            tbody.innerHTML = members.map((m, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td>${m.name}</td>
                    <td>${m.phone}</td>
                    <td>${m.plan}</td>
                    <td>${m.date}</td>
                </tr>
            `).join("");
        }
    </script>
</body>
</html>
