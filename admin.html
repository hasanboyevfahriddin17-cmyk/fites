<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>
        body {
            margin: 0;
            padding: 32px;
            font-family: system-ui, -apple-system, sans-serif;
            background: #09090b;
            color: #f4f4f5;
        }
        .wrapper {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 24px;
        }
        .table-card {
            background: #141419;
            border: 1px solid #23232c;
            border-radius: 14px;
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 16px;
            border-bottom: 1px solid #23232c;
        }
        th {
            background: #1b1b22;
            color: #a1a1aa;
            font-size: 13px;
            text-transform: uppercase;
        }
        tr:last-child td {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>Azolar Royxati</h1>
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Ism</th>
                        <th>Telefon</th>
                        <th>Tarif</th>
                        <th>Sana</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Ali Valiev</td>
                        <td>+998901234567</td>
                        <td>VIP</td>
                        <td>2026-09-11</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
