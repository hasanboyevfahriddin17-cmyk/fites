<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Boshqaruvi | Obsidian GYM</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            min-height: 100vh;
            padding: 36px 20px;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        h1 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
        }

        .back-link {
            display: inline-block;
            padding: 10px 18px;
            background: #1f2833;
            color: #66fcf1;
            text-decoration: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .back-link:hover {
            background: #45a29e;
            color: #0b0c10;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: #12141d;
            border: 1px solid #232533;
            padding: 20px;
            border-radius: 14px;
        }

        .stat-label {
            font-size: 12px;
            color: #8c8d96;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-top: 8px;
        }

        .table-wrapper {
            background: #12141d;
            border: 1px solid #232533;
            border-radius: 16px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: #181a26;
            color: #8c8d96;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 16px 20px;
            border-bottom: 1px solid #232533;
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid #1b1d2a;
            font-size: 14px;
            color: #ffffff;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge-plan {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .plan-Standard {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
        }

        .plan-Premium {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
        }

        .plan-VIP {
            background: rgba(234, 179, 8, 0.15);
            color: #facc15;
        }

        .delete-btn {
            background: transparent;
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ef4444;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .delete-btn:hover {
            background: #ef4444;
            color: #ffffff;
        }

        .empty-row {
            text-align: center;
            color: #8c8d96;
            padding: 32px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <h1>Obsidian GYM Boshqaruvi</h1>
            <a href="/index.html" class="back-link">Bosh sahifaga otish</a>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Jami Azolar</div>
                <div class="stat-value" id="totalCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">VIP Azolar</div>
                <div class="stat-value" id="vipCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Oxirgi qoshilgan sana</div>
                <div class="stat-value" style="font-size: 18px;" id="lastDate">-</div>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>T/r</th>
                        <th>Ism va familiya</th>
                        <th>Telefon</th>
                        <th>Tanlangan tarif</th>
                        <th>Sana</th>
                        <th>Amallar</th>
                    </tr>
                </thead>
                <tbody id="membersList">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function renderTable() {
            const members = JSON.parse(localStorage.getItem("gym_members") || "[]");
            const tbody = document.getElementById("membersList");
            const totalCount = document.getElementById("totalCount");
            const vipCount = document.getElementById("vipCount");
            const lastDate = document.getElementById("lastDate");

            totalCount.textContent = members.length;
            vipCount.textContent = members.filter(m => m.plan === "VIP").length;
            lastDate.textContent = members.length > 0 ? members[members.length - 1].date : "-";

            if (members.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-row">Hozircha hech qanday azo royxatdan otmagan</td></tr>';
                return;
            }

            tbody.innerHTML = members.map((member, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td>${member.name}</td>
                    <td>${member.phone}</td>
                    <td><span class="badge-plan plan-${member.plan}">${member.plan}</span></td>
                    <td>${member.date}</td>
                    <td><button class="delete-btn" onclick="deleteMember(${member.id})">Ochirish</button></td>
                </tr>
            `).join("");
        }

        function deleteMember(id) {
            let members = JSON.parse(localStorage.getItem("gym_members") || "[]");
            members = members.filter(member => member.id !== id);
            localStorage.setItem("gym_members", JSON.stringify(members));
            renderTable();
        }

        renderTable();
    </script>
</body>
</html>
