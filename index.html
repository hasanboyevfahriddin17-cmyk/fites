<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Club</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top, #1a1a24, #0b0b0e);
            color: #f1f1f1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(22, 22, 29, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }
        h1 {
            margin-top: 0;
            font-size: 26px;
            letter-spacing: -0.5px;
        }
        label {
            display: block;
            margin-top: 16px;
            font-size: 14px;
            color: #9ca3af;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            background: #111116;
            border: 1px solid #272732;
            border-radius: 10px;
            color: #fff;
            box-sizing: border-box;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #3b82f6;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Azo bolish</h1>
        <form action="/register" method="POST">
            <label for="name">Ismingiz</label>
            <input type="text" id="name" name="name" required>

            <label for="phone">Telefon raqam</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="plan">Tarif</label>
            <select id="plan" name="plan">
                <option value="Standard">Standard</option>
                <option value="Premium">Premium</option>
                <option value="VIP">VIP</option>
            </select>

            <button type="submit">Royxatdan otish</button>
        </form>
    </div>
</body>
</html>
